<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="AI resume scoring illustration">
  <defs>
    <linearGradient id="sheetG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- soft backdrop shapes -->
  <circle cx="70" cy="60" r="46" fill="#ffffff" opacity="0.08"/>
  <circle cx="380" cy="250" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="350" cy="40" r="6" fill="#A5B4FC" opacity="0.7"/>
  <circle cx="40" cy="230" r="5" fill="#A5B4FC" opacity="0.7"/>
  <path d="M330 70 l6 -14 6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 z" fill="#FDE68A" opacity="0.9"/>
  <path d="M60 150 l4 -10 4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 z" fill="#ffffff" opacity="0.5"/>

  <!-- resume sheet -->
  <g transform="rotate(-4 175 160)">
    <rect x="85" y="55" width="180" height="220" rx="14" fill="url(#sheetG)" stroke="#C7D2FE" stroke-width="2"/>
    <!-- avatar + name lines -->
    <circle cx="120" cy="95" r="16" fill="#818CF8"/>
    <path d="M120 89 a6 6 0 1 1 0 12 a6 6 0 1 1 0 -12 M108 106 q12 -10 24 0" fill="none" stroke="#EEF2FF" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="146" y="84" width="90" height="8" rx="4" fill="#6366F1"/>
    <rect x="146" y="98" width="62" height="6" rx="3" fill="#A5B4FC"/>
    <!-- body lines -->
    <rect x="104" y="130" width="140" height="6" rx="3" fill="#C7D2FE"/>
    <rect x="104" y="145" width="122" height="6" rx="3" fill="#C7D2FE"/>
    <rect x="104" y="160" width="132" height="6" rx="3" fill="#C7D2FE"/>
    <!-- skill chips -->
    <rect x="104" y="180" width="44" height="14" rx="7" fill="#E0E7FF"/>
    <rect x="154" y="180" width="52" height="14" rx="7" fill="#E0E7FF"/>
    <rect x="212" y="180" width="34" height="14" rx="7" fill="#E0E7FF"/>
    <!-- more lines -->
    <rect x="104" y="210" width="140" height="6" rx="3" fill="#DDE3F8"/>
    <rect x="104" y="225" width="112" height="6" rx="3" fill="#DDE3F8"/>
    <rect x="104" y="240" width="126" height="6" rx="3" fill="#DDE3F8"/>
  </g>

  <!-- score gauge -->
  <g transform="translate(292 148)">
    <circle cx="0" cy="0" r="54" fill="#312E81" stroke="#4338CA" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#4338CA" stroke-width="9" opacity="0.55"/>
    <!-- 87% arc -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#ringG)" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="229.6 34.3" transform="rotate(-90)"/>
    <text x="0" y="2" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#ffffff">87</text>
    <text x="0" y="22" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#A5B4FC" letter-spacing="1">MATCH</text>
  </g>

  <!-- magnifier -->
  <g transform="translate(96 236) rotate(-12)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FBBF24" stroke-width="5"/>
    <line x1="14" y1="14" x2="30" y2="30" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="12" fill="#FDE68A" opacity="0.25"/>
  </g>

  <!-- connecting dots resume -> gauge -->
  <g fill="#A5B4FC">
    <circle cx="252" cy="120" r="3"/>
    <circle cx="264" cy="112" r="3" opacity="0.7"/>
    <circle cx="276" cy="104" r="3" opacity="0.45"/>
  </g>
</svg>
