<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Resume file being converted into structured data">
  <defs>
    <linearGradient id="prSheetG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="prPanelG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
  </defs>

  <!-- soft backdrop shapes -->
  <circle cx="64" cy="58" r="44" fill="#ffffff" opacity="0.08"/>
  <circle cx="380" cy="248" r="58" fill="#ffffff" opacity="0.08"/>
  <circle cx="352" cy="36" r="6" fill="#A5B4FC" opacity="0.7"/>
  <circle cx="38" cy="234" r="5" fill="#A5B4FC" opacity="0.7"/>
  <path d="M330 258 l5 -12 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 z" fill="#FDE68A" opacity="0.9"/>

  <!-- resume document with file-type badges -->
  <g transform="rotate(-5 130 150)">
    <rect x="48" y="52" width="164" height="204" rx="14" fill="url(#prSheetG)" stroke="#C7D2FE" stroke-width="2"/>
    <circle cx="82" cy="90" r="15" fill="#818CF8"/>
    <path d="M82 84 a6 6 0 1 1 0 12 a6 6 0 1 1 0 -12 M71 101 q11 -9 22 0" fill="none" stroke="#EEF2FF" stroke-width="2.3" stroke-linecap="round"/>
    <rect x="106" y="80" width="86" height="8" rx="4" fill="#6366F1"/>
    <rect x="106" y="94" width="58" height="6" rx="3" fill="#A5B4FC"/>
    <rect x="66" y="122" width="128" height="6" rx="3" fill="#C7D2FE"/>
    <rect x="66" y="136" width="112" height="6" rx="3" fill="#C7D2FE"/>
    <rect x="66" y="150" width="120" height="6" rx="3" fill="#C7D2FE"/>
    <rect x="66" y="170" width="42" height="14" rx="7" fill="#E0E7FF"/>
    <rect x="114" y="170" width="50" height="14" rx="7" fill="#E0E7FF"/>
    <rect x="66" y="196" width="126" height="6" rx="3" fill="#DDE3F8"/>
    <rect x="66" y="210" width="100" height="6" rx="3" fill="#DDE3F8"/>
    <rect x="66" y="224" width="116" height="6" rx="3" fill="#DDE3F8"/>
  </g>

  <!-- file-type chips -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <rect x="26" y="30" width="44" height="22" rx="11" fill="#F87171"/>
    <text x="48" y="45" fill="#ffffff">PDF</text>
    <rect x="78" y="16" width="48" height="22" rx="11" fill="#60A5FA"/>
    <text x="102" y="31" fill="#ffffff">DOCX</text>
    <rect x="134" y="32" width="44" height="22" rx="11" fill="#FBBF24"/>
    <text x="156" y="47" fill="#ffffff">IMG</text>
  </g>

  <!-- extraction arrow -->
  <g stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M222 150 h34" stroke-dasharray="1 9"/>
    <path d="M250 142 l12 8 -12 8" fill="none"/>
  </g>

  <!-- structured JSON panel -->
  <g transform="rotate(3 330 160)">
    <rect x="266" y="66" width="132" height="182" rx="14" fill="url(#prPanelG)" stroke="#4338CA" stroke-width="2"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">
      <text x="280" y="92" fill="#A5B4FC">{</text>
      <text x="392" y="238" fill="#A5B4FC" text-anchor="end">}</text>
    </g>
    <!-- key/value rows -->
    <g>
      <rect x="288" y="102" width="40" height="7" rx="3.5" fill="#818CF8"/>
      <rect x="334" y="102" width="52" height="7" rx="3.5" fill="#34D399"/>
      <rect x="288" y="120" width="32" height="7" rx="3.5" fill="#818CF8"/>
      <rect x="326" y="120" width="60" height="7" rx="3.5" fill="#34D399"/>
      <rect x="288" y="138" width="46" height="7" rx="3.5" fill="#818CF8"/>
      <rect x="340" y="138" width="40" height="7" rx="3.5" fill="#34D399"/>
      <rect x="288" y="160" width="54" height="7" rx="3.5" fill="#A5B4FC"/>
      <rect x="298" y="176" width="72" height="6" rx="3" fill="#6EE7B7" opacity="0.85"/>
      <rect x="298" y="190" width="60" height="6" rx="3" fill="#6EE7B7" opacity="0.85"/>
      <rect x="288" y="210" width="36" height="12" rx="6" fill="#4338CA"/>
      <rect x="330" y="210" width="44" height="12" rx="6" fill="#4338CA"/>
    </g>
  </g>

  <!-- sparkle over the panel -->
  <path d="M394 52 l6 -14 6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 z" fill="#FDE68A" opacity="0.9" transform="translate(-22 0)"/>
</svg>
