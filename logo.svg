  </g>

  <!-- wordmark -->
  <text x="46" y="30.5" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="27" font-weight="800" fill="#0F172A" letter-spacing="-1">Hire<tspan fill="url(#hiremium-accent)">mium</tspan></text>
</svg>
