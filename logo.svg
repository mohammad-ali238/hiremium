<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 40" role="img" aria-label="Hiremium">
  <defs>
    <linearGradient id="hiremium-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="hiremium-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
