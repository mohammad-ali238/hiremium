<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Hiremium">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- rounded badge background -->
  <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#fav-bg)"/>

  <!-- candidate silhouette (head + shoulders) -->
  <circle cx="20" cy="15.5" r="6" fill="#ffffff"/>
  <path d="M8.5 32 a11.5 11.5 0 0 1 23 0 Z" fill="#ffffff"/>

  <!-- approval check badge -->
  <circle cx="29.5" cy="28" r="7.5" fill="#10B981" stroke="#ffffff" stroke-width="2"/>
  <path d="M26 28 l2.4 2.4 l4.1 -4.6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
